version: 1
plan:
  name: 'LM Studio + Gemma 2 小白手册（三轨并行研究）'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 4
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: research-arch
    title: '研究 1：LM Studio + Gemma 2 本地运行原理（小白向）'
    assigned_to: general
    verified_by: verifier
    timeout_ms: 1500000
    prompt: |
      你的任务：为小白用户写一份关于「LM Studio + Gemma 2 (5GB) 本地运行原理」的科普报告。

      【背景】
      用户工作目录：E:\Antigravity IDE\project\gemma_match
      用户情况：技术小白，正在做一个微信小程序代码生成器项目，使用 LM Studio 在 D 盘跑 Gemma 2 模型。
      他的具体疑问：
      1. 模型 5GB 这么大，是完全跑在本地，还是有其他逻辑？
      2. 哪些数据会离开本机？哪些不会？
      3. 需要什么硬件配置才能跑得动？
      4. 跑的整个链路是啥（从输入一句话到拿到回答）？

      【输出要求】
      把报告写到：E:\Antigravity IDE\project\gemma_match\docs\research\01-lm-studio-architecture.md
      语言：简体中文（小白友好的语气，可以适当用比喻）。
      长度：1500-2500 字。
      必须包含的小节：
        1. 一句话回答「完全本地吗？」 — 给出明确结论。
        2. LM Studio 的工作原理（架构图文字版）— 解释 llama.cpp 后端、GGUF 模型格式、模型量化、CPU/GPU 协同。
        3. 5GB 模型到底装的是什么 — 解释权重文件、tokenizer、metadata。
        4. 数据流图（文字描述）— 从「用户在 LM Studio 输入文字」到「拿到回答」每一步发生什么。
        5. 数据是否出本机？— 明确说「使用本地推理时全部不出本机」，并说明 LM Studio 何时会联网（仅下载模型/检查更新时）。
        6. 硬件需求参考 — Gemma 2 5GB 量化版在普通笔记本上能否跑、推荐配置。
        7. 常见误解澄清 — 比如「不是每次都重新加载 5GB」「启动后会缓存在内存」。

      【工具】
      - 必须使用 web_search 搜索最新资料（LM Studio 官网、llama.cpp 文档、Google Gemma 官方说明），至少 3 次有效搜索。
      - 关键事实必须能在公开资料里找到依据。

      【报告格式】
      - Markdown
      - 顶部放一个 TL;DR 总结（3-5 行）
      - 使用二级标题分节
      - 关键术语首次出现时用粗体
      - 末尾放一个「参考链接」列表

      完成后用一句话总结：报告已写到哪个路径、核心结论是什么。
    verify_prompt: |
      你的任务：独立验证「LM Studio + Gemma 2 本地运行原理」这份报告的事实准确性。

      报告路径：E:\Antigravity IDE\project\gemma_match\docs\research\01-lm-studio-architecture.md

      【验证清单】（每项必须独立核查，不能只看报告自己怎么说）
      1. 「完全本地」的结论是否准确？— 用 web_search 查「LM Studio local inference privacy」验证。
      2. llama.cpp 后端、GGUF 格式、模型量化（Q4_K_M / Q5_K_M 等）描述是否正确？— 查官方文档。
      3. Gemma 2 5GB 量化版（gemma-2-9b-it 的 Q4 量化约 5.5GB）的硬件需求是否合理？— 查 Google AI 官方模型卡。
      4. 数据流图是否技术细节正确？（用户输入 → tokenizer → 模型推理 → detokenizer → 输出）
      5. 「数据是否出本机」的回答是否准确？— 确认 LM Studio 不会在本地推理时上传数据。
      6. 报告对小白是否友好？（没有用过多 jargon、比喻是否恰当、结构是否清晰）
      7. 参考链接是否有效（用 webfetch 抽查至少 2 个）？

      【输出】
      写一份验证报告到：E:\Antigravity IDE\project\gemma_match\docs\research\01-verify.md
      包含：
        - 通过项列表
        - 不通过项（必须给出修正建议和依据）
        - 总体评分（事实准确性 / 小白友好度 / 完整性）
        - PASS / FAIL 结论

      不要复用 producer 的研究路径，必须自己重新搜一遍。

  - id: research-usage
    title: '研究 2：LM Studio 页面使用 + 调参场景（小白向）'
    assigned_to: general
    verified_by: verifier
    timeout_ms: 1500000
    prompt: |
      你的任务：为小白用户写一份「LM Studio 怎么在页面上使用 + 调参 + 接入外部应用」的操作指南。

      【背景】
      用户已下载 5GB 的 Gemma 2 模型到 LM Studio，但不知道怎么在页面上用，也不知道能调什么参数。
      他的项目（gemma_client.py）已经在通过 http://localhost:1234/v1 调 LM Studio 的 OpenAI 兼容 API。

      【输出要求】
      把报告写到：E:\Antigravity IDE\project\gemma_match\docs\research\02-lm-studio-usage.md
      语言：简体中文（小白友好，step-by-step 风格）。
      长度：2000-3000 字。
      必须包含的小节：
        1. 启动 LM Studio 本地服务器 — 详细步骤（Developer tab → Start Server → 记下端口和 API key）。
        2. 三种使用界面（Chat / Playground / Server）分别干嘛 — 给出截图描述和典型场景。
        3. 关键参数详解（小白版）：
           - Temperature（温度，越高越发散）
           - Top P（核采样）
           - Max Tokens（最大输出长度）
           - Context Length（上下文窗口，决定能塞多少输入）
           - GPU Offload（显存够的话全 GPU，否则 CPU 兜底）
           - Prompt Format（ChatML / Gemma chat template）
           对每个参数给出「建议值 + 适用场景」。
        4. 如何在外部页面调用 — 给出 curl / Python urllib / OpenAI Python SDK 三种示例代码（用户已用 urllib，所以重点讲解 urllib 那块）。
        5. 接入用户现有项目 — 解读 gemma_client.py 的本地调用逻辑（http://localhost:1234/v1/chat/completions），并指出 model 字段填什么。
        6. 常见坑 — 比如「Server 没启动」「端口被占」「模型没加载完」「第一次调用很慢（模型预热）」。
        7. 进阶玩法 — 提示词工程、System Prompt、Few-shot 提示。

      【工具】
      - 必须使用 web_search 搜索 LM Studio 官方文档、OpenAI API 兼容规范、Gemma 2 推理参数推荐。
      - 至少 3 次有效搜索。

      【报告格式】
      - Markdown
      - 顶部 TL;DR（3-5 行）
      - 关键步骤用「步骤 1 / 步骤 2」编号
      - 代码块标注语言
      - 末尾「参考链接」

      完成后用一句话总结：报告已写到哪个路径、核心要点是什么。
    verify_prompt: |
      你的任务：独立验证「LM Studio 页面使用 + 调参」这份报告的操作准确性。

      报告路径：E:\Antigravity IDE\project\gemma_match\docs\research\02-lm-studio-usage.md

      【验证清单】
      1. 启动本地服务器的步骤是否正确（Developer tab → Start Server）？— 查 LM Studio 官方文档。
      2. API 端点 http://localhost:1234/v1/chat/completions 是否正确？— 查 LM Studio 文档确认。
      3. 调参建议是否合理（temperature 0.7、top_p 0.9、context length 推荐值）？— 用 web_search 查「LM Studio recommended parameters」。
      4. Python urllib 调用示例代码是否能跑通（语法、请求体格式）？
      5. gemma_client.py 解读是否准确（model 字段、messages 格式、temperature）？
      6. 常见坑部分是否覆盖了「Server 没启动」「端口冲突」「模型未加载」？
      7. 是否对小友好（步骤清晰、不假设用户有 ML 背景）？

      【输出】
      写验证报告到：E:\Antigravity IDE\project\gemma_match\docs\research\02-verify.md
      包含：通过项 / 不通过项（含修正建议）/ 评分 / PASS 或 FAIL。

      不要复用 producer 的研究路径，自己重新搜。

  - id: research-beginner-path
    title: '研究 3：Gemma 小白入门训练 / 微调 / 配置路径（小程序场景）'
    assigned_to: general
    verified_by: verifier
    timeout_ms: 1500000
    prompt: |
      你的任务：为完全没接触过模型训练的小白用户，规划一条「Gemma 模型入门训练 / 微调 / 配置」的循序渐进学习路径。

      【背景】
      用户做的是微信小程序代码生成器（输入自然语言 → 输出 WXML/WXSS/JS 三段式代码），目前使用本地 Gemma 2 + LM Studio。他想自己训练或微调以提升小程序代码生成质量，但完全没经验。
      用户已有的相关项目：
        - E:\Antigravity IDE\project\gemma_match\app.py（Streamlit UI + 调模型）
        - E:\Antigravity IDE\project\gemma_match\golden_examples\（手写 3 个黄金样例）
        - E:\Antigravity IDE\project\gemma_match\prompt_builder.py（system prompt + few-shot）
        - legacy-python\README.md 提到了 Gemma Function Calling 思路

      【输出要求】
      把报告写到：E:\Antigravity IDE\project\gemma_match\docs\research\03-gemma-beginner-path.md
      语言：简体中文（小白友好，每个阶段都说清楚「要做什么 / 预计耗时 / 关键产出 / 资源链接」）。
      长度：2500-4000 字。
      必须包含的小节：
        1. 心智模型建立 — 训练 vs 微调 vs Prompt Engineering 的区别（用比喻讲清楚）。
        2. 阶段 0：先把 Prompt 玩明白（零门槛）— 教用户怎么写好的 system prompt + few-shot，怎么用现有 app.py + golden_examples 迭代 prompt。给 1-2 个具体练习。
        3. 阶段 1：Hugging Face + Transformers 跑通本地推理（1-2 天）— 用 transformers 库加载 Gemma 2、写最小推理脚本。给出代码示例和环境配置。
        4. 阶段 2：Unsloth + LoRA 微调（2-3 天）— 推荐 Unsloth（小白友好、显存占用低），讲清楚数据格式（Alpaca / ShareGPT）、怎么用自己的 golden_examples 准备微调数据。
        5. 阶段 3：把微调后的模型导回 LM Studio / Ollama 跑（0.5 天）— GGUF 转换、量化、用回现有 gemma_client.py。
        6. 阶段 4：Function Calling / Tool Use（可选进阶，1-2 天）— 对应 legacy-python\README.md 的 Gemma Function Calling 思路。讲清楚 Gemma 是否原生支持 tool use（如不支持，推荐改用 Gemini API 或用 prompt 模拟）。
        7. 硬件门槛提示 — 每阶段最低显存 / 推荐显存 / 是否有云端替代（Google Colab 免费 T4、Kaggle Notebooks）。
        8. 推荐学习资源 — 至少 5 个可信链接（Hugging Face 官方教程、Unsloth GitHub、Google AI Gemma Cookbook、LoRA 原论文科普等）。
        9. 「别走弯路」提醒 — 比如「不要一上来就训练」「先优化 prompt」「准备至少 100 条高质量样本再考虑微调」。

      【工具】
      - 必须使用 web_search 搜索最新的「Gemma 2 微调 2025/2026」教程、Unsloth 官方文档、Hugging Face PEFT 教程。
      - 至少 4 次有效搜索。
      - 必须验证推荐链接的有效性（用 webfetch 抽查至少 3 个链接）。

      【报告格式】
      - Markdown
      - 顶部 TL;DR（3-5 行）
      - 每个阶段用 H2 标题，内部用 checklist 或步骤编号
      - 代码块标注语言
      - 资源链接要可点击
      - 末尾「参考链接」+「推荐下一步」

      完成后用一句话总结：报告已写到哪个路径、推荐路径是什么、预计总学习时长。
    verify_prompt: |
      你的任务：独立验证「Gemma 小白入门训练 / 微调路径」这份报告的可行性和准确性。

      报告路径：E:\Antigravity IDE\project\gemma_match\docs\research\03-gemma-beginner-path.md

      【验证清单】
      1. 「训练 vs 微调 vs Prompt Engineering」概念区分是否准确？— 用 web_search 抽查。
      2. 推荐的 4 阶段路径是否循序渐进、对小白可行？— 检查每阶段「预期耗时 / 硬件门槛 / 关键产出」是否合理。
      3. Unsloth 库的推荐是否合适（对小显存友好、Colab 可用）？— 查 Unsloth 官方文档确认。
      4. LoRA / QLoRA 的描述是否准确？— 抽查关键概念。
      5. 推荐的学习资源链接是否有效？— 用 webfetch 抽查至少 3 个链接。
      6. 硬件门槛建议是否合理（Gemma 2 9B 全量微调要多大显存、LoRA 微调呢）？— 查官方推荐。
      7. 「数据格式（Alpaca / ShareGPT）」是否描述正确？— 抽查一份官方文档。
      8. 是否覆盖了「先优化 prompt 再考虑微调」这条重要建议？
      9. Function Calling 部分对 Gemma 现状的描述是否准确（Gemma 原生 tool use 能力现状）？— 用 web_search 查「Gemma 3 function calling 2025」或最新。
      10. 总学习时长预估是否合理（不能明显低估）？

      【输出】
      写验证报告到：E:\Antigravity IDE\project\gemma_match\docs\research\03-verify.md
      包含：通过项 / 不通过项（含修正建议）/ 评分 / PASS 或 FAIL。

      必须自己用 web_search / webfetch 重新核验，不能复用 producer 的搜索结果。
